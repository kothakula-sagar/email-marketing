name: Deploy mail Worker
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      GMAIL_USER_EMAIL: ${{ secrets.GMAIL_USER_EMAIL }}
      SEND_ACCESS_TOKEN: ${{ secrets.SEND_ACCESS_TOKEN }}
      ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      FROM_NAME: ${{ secrets.FROM_NAME }}
      COMPANY_NAME: ${{ secrets.COMPANY_NAME }}
      POSTAL_ADDRESS: ${{ secrets.POSTAL_ADDRESS }}
      UNSUBSCRIBE_EMAIL: ${{ secrets.UNSUBSCRIBE_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check required environment secrets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const provider = String(process.env.EMAIL_PROVIDER || "resend").toLowerCase();
          if (!["gmail","resend"].includes(provider)) { console.error("EMAIL_PROVIDER must be gmail or resend."); process.exit(1); }
          const required = ["CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID","SEND_ACCESS_TOKEN","ALLOWED_ORIGIN","SENDER_EMAIL","FROM_NAME","COMPANY_NAME","POSTAL_ADDRESS","UNSUBSCRIBE_EMAIL"];
          required.push(...(provider === "gmail" ? ["GMAIL_CLIENT_ID","GMAIL_CLIENT_SECRET","GMAIL_REFRESH_TOKEN","GMAIL_USER_EMAIL"] : ["RESEND_API_KEY"]));
          const missing = required.filter(key => !process.env[key]);
          if (missing.length) { console.error("Missing production environment secrets: " + missing.join(", ")); process.exit(1); }
          if (process.env.SEND_ACCESS_TOKEN.length < 24) { console.error("SEND_ACCESS_TOKEN must have 24 or more characters."); process.exit(1); }
          NODE
      - name: Deploy worker with runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const keys = ["RESEND_API_KEY","GMAIL_CLIENT_ID","GMAIL_CLIENT_SECRET","GMAIL_REFRESH_TOKEN","GMAIL_USER_EMAIL","SEND_ACCESS_TOKEN","ALLOWED_ORIGIN","SENDER_EMAIL","FROM_NAME","COMPANY_NAME","POSTAL_ADDRESS","UNSUBSCRIBE_EMAIL"];
          const values = Object.fromEntries(keys.filter(key => process.env[key]).map(key => [key, process.env[key]]));
          values.EMAIL_PROVIDER = String(process.env.EMAIL_PROVIDER || "resend").toLowerCase();
          fs.writeFileSync(".worker-secrets.json", JSON.stringify(values), {mode: 0o600});
          NODE
          trap 'rm -f .worker-secrets.json' EXIT
          npx --yes wrangler@4 deploy --config wrangler.toml --secrets-file .worker-secrets.json
